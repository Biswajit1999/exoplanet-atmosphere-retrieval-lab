name: Spectral robustness research
on:
  push:
    paths:
      - 'scripts/spectral_robustness.py'
      - 'scripts/run_spectral_robustness.py'
      - 'tests/test_spectral_robustness.py'
      - 'data/wasp39b_benchmark.json'
      - '.github/workflows/spectral-robustness.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scientific-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy>=1.26,<3' 'matplotlib>=3.8,<4'
      - run: python -m unittest discover -s tests -p 'test_spectral_robustness.py' -v
      - run: python scripts/run_spectral_robustness.py --output results/spectral_robustness.json --plot results/spectral_robustness.png
      - uses: actions/upload-artifact@v4
        with:
          name: conditional-spectral-diagnostics
          path: results/spectral_robustness.*
